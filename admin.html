<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Orkap - Final</title>
<style>body{font-family:Arial;background:#f4f8fc;padding:15px;color:#263442}.login,.panel{max-width:1200px;margin:auto;background:white;padding:20px;border-radius:12px;border:1px solid #e5ebf2}input{padding:8px;border:1px solid #e5ebf2;border-radius:6px;width:100%;box-sizing:border-box}button{background:#527fae;color:white;border:none;padding:10px 16px;border-radius:7px;font-weight:bold;cursor:pointer;margin:2px}button.green{background:#218838}button.black{background:#111}button.sec{background:#eaf2fa;color:#527fae}button.red{background:#c0392b}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:8px;border-bottom:1px solid #e5ebf2;font-size:13px;text-align:left}</style>
</head><body>
<div class="login" id="loginBox"><h2>Admin Orkap</h2><input id="email" type="email" placeholder="teu email do Firebase" style="margin-bottom:10px"><input id="pass" type="password" placeholder="senha 6 dígitos"><br><br><button onclick="login()">Entrar</button><p id="msg" style="color:red;font-size:12px"></p></div>
<div class="panel" id="panel" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>Painel - Ordem e Preços</h2><button class="red" onclick="logout()">Sair</button></div>
<button class="green" onclick="importarDemo()">DEFINIR ORDEM: Benfica, Sporting, Real, Barça primeiro</button>
<button class="black" onclick="adicionarProduto()">+ Novo Produto</button>
<div style="margin-top:15px;display:flex;gap:10px"><input id="percent" type="number" placeholder="% Ex: 10" style="max-width:150px"><button onclick="aplicarPercentual()">Aplicar % em TODOS</button><button class="sec" onclick="carregar()">Recarregar</button></div>
<table><thead><tr><th>Ordem</th><th>Produto</th><th>Kz</th><th>€</th><th></th></tr></thead><tbody id="lista"></tbody></table>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAiQo9h8luDPyLLuPHKauiFFxib7xoumRQ",
  authDomain: "orkap-d13c6.firebaseapp.com",
  databaseURL: "https://orkap-d13c6-default-rtdb.firebaseio.com",
  projectId: "orkap-d13c6",
  storageBucket: "orkap-d13c6.firebasestorage.app",
  messagingSenderId: "571248205991",
  appId: "1:571248205991:web:65dca626cee2be2f74fb82"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();

function login(){auth.signInWithEmailAndPassword(document.getElementById("email").value,document.getElementById("pass").value).catch(e=>document.getElementById("msg").innerText=e.message)}
function logout(){auth.signOut()}
auth.onAuthStateChanged(user=>{if(user){document.getElementById("loginBox").style.display="none";document.getElementById("panel").style.display="block";carregar();}else{document.getElementById("loginBox").style.display="block";document.getElementById("panel").style.display="none";}});

const ORDEM_FIXA={"benfica":1,"sporting":2,"real-madrid":3,"barcelona":4,"porto":5,"man-city":6,"man-united":7,"arsenal":8,"liverpool":9,"chelsea":10,"bayern":11,"psg":12,"juventus":13,"flamengo":14,"palmeiras":15,"corinthians":16,"al-nassr":17,"inter-miami":18};

const demoProducts=[
{id:"benfica",nome:"Equipamento Benfica"},{id:"sporting",nome:"Equipamento Sporting"},{id:"real-madrid",nome:"Equipamento Real Madrid"},{id:"barcelona",nome:"Equipamento Barcelona"},{id:"porto",nome:"Equipamento FC Porto"},{id:"man-city",nome:"Man City"},{id:"man-united",nome:"Man United"},{id:"arsenal",nome:"Arsenal"},{id:"liverpool",nome:"Liverpool"},{id:"chelsea",nome:"Chelsea"},{id:"bayern",nome:"Bayern"},{id:"psg",nome:"PSG"},{id:"flamengo",nome:"Flamengo"}
];

function carregar(){
  db.ref("produtos").once("value",snap=>{
    const tbody=document.getElementById("lista");
    tbody.innerHTML="";
    let lista=[];
    snap.forEach(c=>{lista.push({id:c.key, ...c.val()})});
    lista.sort((a,b)=>(a.ordem||999)-(b.ordem||999));
    lista.forEach(p=>{
      tbody.innerHTML+=`<tr><td><input id="ordem_${p.id}" type="number" value="${p.ordem||99}" style="width:60px"></td><td><b>${p.nome}</b></td><td><input id="kz_${p.id}" type="number" value="${p.precoKz||0}"></td><td><input id="eur_${p.id}" type="number" value="${p.precoEUR||0}"></td><td><button onclick="salvar('${p.id}')">Salvar</button></td></tr>`;
    });
  });
}
function salvar(id){
  const ordem=Number(document.getElementById("ordem_"+id).value);
  const precoKz=Number(document.getElementById("kz_"+id).value);
  const precoEUR=Number(document.getElementById("eur_"+id).value);
  db.ref("produtos/"+id).update({ordem,precoKz,precoEUR}).then(()=>alert("Salvo!"));
}
function importarDemo(){
  if(!confirm("Definir ordem: Benfica 1, Sporting 2, Real 3, Barça 4 e os restantes depois? (NÃO apaga fotos)"))return;
  db.ref("produtos").once("value",snap=>{
    snap.forEach(child=>{
      const id=child.key;
      const ordem=ORDEM_FIXA[id]||99;
      db.ref("produtos/"+id).update({ordem});
    });
    alert("Ordem aplicada!");
    setTimeout(carregar,1000);
  });
}
function adicionarProduto(){const nome=prompt("Nome:");if(!nome)return;const id=nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now();const precoKz=Number(prompt("Kz:"));const precoEUR=Number(prompt("€:"));const ordem=Number(prompt("Ordem (1=primeiro):")||99);db.ref("produtos/"+id).set({id,nome,categoria:"Equipamentos",precoKz,precoEUR,ordem,ativo:true}).then(()=>carregar());}
function aplicarPercentual(){const perc=Number(document.getElementById("percent").value);if(!perc)return;if(!confirm(`Aplicar ${perc}% em todos?`))return;db.ref("produtos").once("value",snap=>{snap.forEach(child=>{const p=child.val();db.ref("produtos/"+child.key).update({precoKz:Math.round((p.precoKz||0)*(1+perc/100)),precoEUR:+((p.precoEUR||0)*(1+perc/100)).toFixed(2)});});setTimeout(carregar,1000);});}
</script></body></html>
