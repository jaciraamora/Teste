<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Orkap</title>
<style>body{font-family:Arial;background:#f4f8fc;padding:20px;color:#263442}h1{color:#527fae}.login,.panel{max-width:1100px;margin:auto;background:white;padding:20px;border-radius:12px;border:1px solid #e5ebf2}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #e5ebf2;text-align:left;font-size:13px}input{padding:8px;border:1px solid #e5ebf2;border-radius:6px;width:100%}button{background:#527fae;color:white;border:none;padding:9px 14px;border-radius:7px;font-weight:bold;cursor:pointer}button.sec{background:#eaf2fa;color:#527fae}</style>
</head><body>
<div class="login" id="loginBox"><h1>Admin Orkap</h1><input type="password" id="pass" placeholder="Senha"><br><br><button onclick="login()">Entrar</button><p style="font-size:11px">Senha: orkap2024</p></div>
<div class="panel" id="panel" style="display:none">
<h1>Painel de Preços</h1>
<button onclick="importarDemo()" style="background:#218838">IMPORTAR PRODUTOS DO SITE PARA FIREBASE (clica só 1 vez)</button>
<div style="margin-top:15px;display:flex;gap:10px"><input id="percent" type="number" placeholder="% Ex: 10" style="max-width:180px"><button onclick="aplicarPercentual()">Aplicar % a TODOS</button><button class="sec" onclick="carregar()">Recarregar</button></div>
<table><thead><tr><th>Produto</th><th>Kz</th><th>€</th><th></th></tr></thead><tbody id="lista"></tbody></table>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const SENHA="orkap2024";function login(){if(document.getElementById("pass").value===SENHA){document.getElementById("loginBox").style.display="none";document.getElementById("panel").style.display="block";carregar();}else alert("Senha errada");}
const firebaseConfig={apiKey:"AIzaSyAiQo9h8luDPyLLuPHKauiFX7b7oumRQ",authDomain:"orkap-d13c6.firebaseapp.com",databaseURL:"https://orkap-d13c6-default-rtdb.firebaseio.com",projectId:"orkap-d13c6",storageBucket:"orkap-d13c6.firebasestorage.app",messagingSenderId:"571248205991",appId:"1:571248205991:web:65dca626cee2be2f74fb82"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();

const demoProducts=[{id:"rm-demo",nome:"Equipamento Real Madrid",categoria:"Equipamentos",marca:"Real Madrid",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"barca-demo",nome:"Equipamento Barcelona",categoria:"Equipamentos",marca:"Barcelona",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"benfica-demo",nome:"Equipamento Benfica",categoria:"Equipamentos",marca:"Benfica",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"sporting-demo",nome:"Equipamento Sporting",categoria:"Equipamentos",marca:"Sporting",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"porto-demo",nome:"Equipamento FC Porto",categoria:"Equipamentos",marca:"FC Porto",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"bayern-demo",nome:"Equipamento Bayern",categoria:"Equipamentos",marca:"Bayern",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"city-demo",nome:"Equipamento Manchester City",categoria:"Equipamentos",marca:"Manchester City",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"united-demo",nome:"Equipamento Manchester United",categoria:"Equipamentos",marca:"Manchester United",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"psg-demo",nome:"Equipamento PSG",categoria:"Equipamentos",marca:"PSG",descricao:"Modelos e tamanhos disponíveis.",precoKz:52000,precoEUR:40,ativo:true},{id:"sauvage-demo",nome:"Dior Sauvage",categoria:"Perfumes",marca:"Dior",descricao:"Confirma a versão.",precoKz:30000,precoEUR:48,ativo:true},{id:"rabanne-demo",nome:"Paco Rabanne",categoria:"Perfumes",marca:"Paco Rabanne",descricao:"Confirma a versão.",precoKz:35000,precoEUR:55,ativo:true},{id:"zara-demo",nome:"Perfume Zara",categoria:"Perfumes",marca:"Zara",descricao:"Indica a fragrância.",precoKz:18000,precoEUR:29,ativo:true}];

function importarDemo(){if(!confirm("Importar todos para o Firebase? Faz isso só 1 vez."))return;demoProducts.forEach(p=>{db.ref("produtos/"+p.id).set(p)});alert("Importado! Agora recarregando...");setTimeout(carregar,1500);}
function carregar(){db.ref("produtos").once("value",snap=>{const tbody=document.getElementById("lista");tbody.innerHTML="";if(!snap.exists()){tbody.innerHTML="<tr><td colspan=4>Clica no botão VERDE acima para importar primeiro.</td></tr>";return;}snap.forEach(child=>{const p=child.val();const id=child.key;tbody.innerHTML+=`<tr><td><b>${p.nome}</b><br><small>${p.marca||""}</small></td><td><input id="kz_${id}" type="number" value="${p.precoKz}"></td><td><input id="eur_${id}" type="number" value="${p.precoEUR}"></td><td><button onclick="salvar('${id}')">Salvar</button></td></tr>`;});});}
function salvar(id){const precoKz=Number(document.getElementById("kz_"+id).value);const precoEUR=Number(document.getElementById("eur_"+id).value);db.ref("produtos/"+id).update({precoKz,precoEUR}).then(()=>alert("Atualizado!"));}
function aplicarPercentual(){const perc=Number(document.getElementById("percent").value);if(!perc)return alert("Digite %");if(!confirm(`Aplicar ${perc}% em TODOS?`))return;db.ref("produtos").once("value",snap=>{snap.forEach(child=>{const p=child.val();const novoKz=Math.round(p.precoKz*(1+perc/100));const novoEUR=+(p.precoEUR*(1+perc/100)).toFixed(2);db.ref("produtos/"+child.key).update({precoKz:novoKz,precoEUR:novoEUR});});alert("Atualizado!");setTimeout(carregar,1000);});}
</script></body></html>
