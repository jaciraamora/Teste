<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orkap</title>
<style>body{font-family:Arial;background:#eef3f8;padding:16px} .box{max-width:900px;margin:20px auto;background:#fff;padding:24px;border-radius:16px} input{padding:14px;border:1px solid #ccc;border-radius:10px;width:100%;box-sizing:border-box;font-size:16px} button{padding:14px 20px;background:#2f6eae;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:16px;width:100%;cursor:pointer} .item{border:1px solid #e2e8f0;padding:16px;border-radius:12px;margin-top:12px}</style>
</head><body>
<div class="box" id="loginBox"><h3>Admin Orkap</h3><input id="email" placeholder="Email"><br><br><input id="pass" type="password" placeholder="Senha"><br><br><button onclick="login()">Entrar</button><p id="msg" style="color:red;margin-top:10px"></p><p id="debug" style="font-size:11px;color:#888"></p></div>
<div class="box" id="panel" style="display:none"><h3>Preços</h3><button onclick="logout()" style="background:#c0392b">Sair</button><div id="lista" style="margin-top:15px"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAiQo9h8luDPyLLuPHKauiFFxib7xoumRQ",authDomain:"orkap-d13c6.firebaseapp.com",databaseURL:"https://orkap-d13c6-default-rtdb.firebaseio.com",projectId:"orkap-d13c6",storageBucket:"orkap-d13c6.firebasestorage.app",messagingSenderId:"571248205991",appId:"1:571248205991:web:65dca626cee2be2f74fb82"};
try{firebase.initializeApp(firebaseConfig);document.getElementById("debug").innerText="Firebase OK"}catch(e){document.getElementById("debug").innerText=e.message}
const db=firebase.database();const auth=firebase.auth();
function login(){msg.innerText="A entrar...";auth.signInWithEmailAndPassword(document.getElementById("email").value,document.getElementById("pass").value).then(()=>{msg.innerText=""}).catch(e=>{msg.innerText=e.code+" : "+e.message})}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{if(u){loginBox.style.display="none";panel.style.display="block";carregar()}else{loginBox.style.display="block";panel.style.display="none"}})
function carregar(){
 lista.innerHTML="Carregando produtos...";
 db.ref("produtos").once("value").then(s=>{
   if(!s.exists()){lista.innerHTML="<p>Nenhum produto no Firebase. Abre o teu site principal uma vez.</p>";return}
   lista.innerHTML=""; s.forEach(c=>{
     const id=c.key; const p=c.val();
     lista.innerHTML+=`<div class="item"><b>${p.nome||id}</b><br><br><div style="display:flex;gap:10px"><input id="kz_${id}" type="number" value="${p.precoKz||0}"><input id="eur_${id}" type="number" value="${p.precoEUR||0}"></div><br><button onclick="salvar('${id}')">Salvar ${p.nome||id}</button></div>`
   })
 }).catch(e=>{lista.innerHTML="Erro: "+e.message})
}
function salvar(id){db.ref("produtos/"+id).update({precoKz:Number(document.getElementById("kz_"+id).value),precoEUR:Number(document.getElementById("eur_"+id).value)}).then(()=>alert("Salvo "+id))}
</script></body></html>
